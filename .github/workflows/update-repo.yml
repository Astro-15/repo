name: Build Repo Index

on:
  push:
    paths:
      - 'deb/**'  # Runs automatically whenever a file in the 'deb' folder is added or modified

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dpkg & bzip2
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev bzip2

      - name: Generate Packages and Packages.bz2
        run: |
          dpkg-scanpackages -m ./deb /dev/null > Packages
          bzip2 -f -k Packages

      - name: Commit and Push Updated Index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.bz2
          git diff-index --quiet HEAD || git commit -m "Auto-generate Packages index"
          git push
